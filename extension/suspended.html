<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Suspended tab</title>
    <link id="favicon" rel="icon" href="" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1b1b;
        color: #ccc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0.7;
      }
      img {
        width: 32px;
        height: 32px;
      }
      span {
        font-size: 14px;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="placeholder">
      <img id="icon" alt="" />
      <span id="label"></span>
    </div>
    <script src="suspended.js"></script>
  </body>
</html>
